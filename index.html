<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>男娘指数测试 · Femboy Index Test</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  /* ============ 背景极光 ============ */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
      background:linear-gradient(140deg,#fff4fa 0%,#f6efff 48%,#eef6ff 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;pointer-events:none}
  .b1{width:440px;height:440px;background:radial-gradient(circle,#ff9ecb,transparent 70%);
      top:-150px;left:-120px;animation:drift1 20s ease-in-out infinite}
  .b2{width:500px;height:500px;background:radial-gradient(circle,#b89cff,transparent 70%);
      bottom:-180px;right:-130px;animation:drift2 24s ease-in-out infinite}
  .b3{width:360px;height:360px;background:radial-gradient(circle,#8ac4ff,transparent 70%);
      top:38%;left:52%;animation:drift3 26s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,70px) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-60px) scale(1.12)}}
  @keyframes drift3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-42%,-62%) scale(1.2)}}

  .float-emoji{
    position:fixed;z-index:-1;pointer-events:none;
    font-size:22px;opacity:.25;filter:blur(.3px);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(110vh) rotate(0deg);opacity:0}
    10%{opacity:.28}
    90%{opacity:.28}
    100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
  }

  body{
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#2b2b33;padding:40px 16px;
  }
  .app{
    width:100%;max-width:660px;position:relative;
    background:rgba(255,255,255,.66);
    backdrop-filter:blur(26px) saturate(1.6);
    -webkit-backdrop-filter:blur(26px) saturate(1.6);
    border-radius:32px;padding:38px 34px 30px;
    border:1px solid rgba(255,255,255,.9);
    box-shadow:
      0 24px 60px rgba(180,120,180,.16),
      0 2px 8px rgba(0,0,0,.04),
      inset 0 1px 0 rgba(255,255,255,.9);
  }
  .hidden{display:none!important}

  /* ============ 语言按钮 ============ */
  .lang-btn{
    position:absolute;top:16px;right:16px;z-index:5;
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 13px;border-radius:99px;
    background:rgba(255,255,255,.85);
    border:1px solid rgba(224,80,143,.22);
    color:#c23d78;font-family:inherit;
    font-size:11.5px;font-weight:700;letter-spacing:.8px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(224,80,143,.12);
    transition:all .22s cubic-bezier(.3,1,.4,1);
    animation:fadeUp .6s cubic-bezier(.2,.8,.3,1) backwards;
  }
  .lang-btn:hover{
    background:#fff;
    border-color:#e0508f;
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(224,80,143,.22);
  }
  .lang-btn:active{transform:scale(.96)}

  /* ============ 开始页 ============ */
  #screen-start{display:flex;flex-direction:column;gap:18px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .hero{
    display:flex;flex-direction:column;align-items:center;
    gap:16px;padding-top:2px;
  }
  .hero > *{animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) backwards}
  .hero > *:nth-child(1){animation-delay:.05s}
  .hero > *:nth-child(2){animation-delay:.14s}
  .hero > *:nth-child(3){animation-delay:.23s}

  .hero-badge{
    display:inline-flex;align-items:center;gap:7px;
    width:fit-content;
    padding:6px 15px;border-radius:99px;
    background:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.95);
    font-size:11.5px;color:#c23d78;letter-spacing:2px;font-weight:600;
    box-shadow:0 4px 16px rgba(224,80,143,.14);
  }
  .hero-badge::before{content:'✦';font-size:9px;opacity:.65}
  .hero-badge::after{content:'✦';font-size:9px;opacity:.65}

  .title-wrap{
    display:inline-flex;align-items:center;justify-content:center;
    gap:14px;white-space:nowrap;
  }
  .hero-title{
    font-size:36px;font-weight:800;letter-spacing:3px;line-height:1.25;
    background:linear-gradient(120deg,#e0508f 0%,#a06ae0 45%,#e0508f 90%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 7s linear infinite;
    padding-left:3px;
  }
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:220% 50%}}

  .float-deco{
    flex:0 0 auto;font-size:20px;line-height:1;
    filter:drop-shadow(0 4px 8px rgba(224,80,143,.3));
    animation:floatY 3.4s ease-in-out infinite;
  }
  .float-deco.r{animation-delay:.55s}
  @keyframes floatY{
    0%,100%{transform:translateY(0) rotate(-8deg)}
    50%{transform:translateY(-8px) rotate(6deg)}
  }

  .hero-sub{
    font-size:13.5px;color:#9a8fa0;letter-spacing:.5px;line-height:1.7;
    text-align:center;
  }

  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:12px;
    animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) .32s backwards;
  }
  .stat{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:82px;padding:14px 10px;
    background:rgba(255,255,255,.75);
    border:1px solid rgba(255,255,255,.95);
    border-radius:18px;
    box-shadow:0 4px 16px rgba(180,140,200,.08);
    transition:transform .25s cubic-bezier(.3,1,.4,1),box-shadow .25s;
    position:relative;
  }
  .stat::after{
    content:attr(data-emoji);
    position:absolute;top:-9px;right:10px;font-size:14px;
    opacity:0;transform:scale(.5);
    transition:all .3s cubic-bezier(.3,1.6,.5,1);
  }
  .stat:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(180,140,200,.16)}
  .stat:hover::after{opacity:1;transform:scale(1) rotate(15deg)}
  .stat b{
    font-size:26px;font-weight:800;line-height:1.1;
    background:linear-gradient(135deg,#e0508f,#a06ae0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat span{font-size:11px;color:#a89db0;letter-spacing:.8px;margin-top:6px;line-height:1}

  .features{
    list-style:none;
    padding:18px 22px;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.92);
    border-radius:18px;
    animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) .41s backwards;
  }
  .features li{
    display:flex;align-items:flex-start;gap:10px;
    font-size:13px;color:#6b6470;line-height:1.65;
    padding:8px 0;
  }
  .features li + li{border-top:1px dashed rgba(224,80,143,.1)}
  .features li::before{
    content:'♡';flex:0 0 auto;
    font-size:14px;line-height:1.5;
    color:#ff8ec4;
    text-shadow:0 0 8px rgba(255,142,196,.6);
  }

  .statement{
    border-radius:18px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.92);
    overflow:hidden;
    animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) .45s backwards;
  }
  .stmt-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;padding:13px 18px;
    background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:600;
    color:#c23d78;letter-spacing:.6px;text-align:left;
    transition:background .2s;
  }
  .stmt-head:hover{background:rgba(255,236,246,.6)}
  .stmt-head .ttl{display:flex;align-items:center;gap:8px}
  .stmt-head .arrow{
    flex:0 0 auto;font-size:9px;color:#d99ab8;
    transition:transform .35s cubic-bezier(.3,1,.4,1);
  }
  .statement.open .stmt-head .arrow{transform:rotate(180deg)}
  .stmt-body{
    max-height:0;overflow:hidden;
    transition:max-height .45s cubic-bezier(.3,1,.4,1);
  }
  .statement.open .stmt-body{max-height:640px}
  .stmt-inner{
    padding:14px 18px 16px;
    border-top:1px dashed rgba(224,80,143,.16);
  }
  .stmt-inner p{
    font-size:12.5px;line-height:1.9;color:#6b6470;text-align:left;
  }
  .stmt-inner p + p{margin-top:9px}
  .stmt-inner .sig{
    margin-top:11px;text-align:right;
    font-size:11.5px;font-weight:600;color:#b07aa0;letter-spacing:.5px;
  }

  .btn-start{
    position:relative;display:block;width:100%;
    padding:17px;border:none;border-radius:18px;
    background:linear-gradient(135deg,#ff6bb5 0%,#e0508f 45%,#a06ae0 100%);
    background-size:200% 200%;
    color:#fff;font-size:16.5px;font-weight:700;letter-spacing:4px;
    cursor:pointer;font-family:inherit;overflow:hidden;
    box-shadow:0 10px 28px rgba(224,80,143,.36),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .3s cubic-bezier(.3,1,.4,1),box-shadow .3s,background-position .5s;
    animation:
      fadeUp .7s cubic-bezier(.2,.8,.3,1) .5s backwards,
      btnPulse 3.2s ease-in-out .9s infinite alternate;
  }
  .btn-start:hover{
    transform:translateY(-2px);
    background-position:100% 50%;
    box-shadow:0 16px 36px rgba(224,80,143,.46),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn-start:active{transform:translateY(0) scale(.99)}
  .btn-start::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);
    background-size:220% 100%;
    animation:shine 3.4s ease-in-out infinite;
  }
  @keyframes shine{0%,100%{background-position:-120% 0}50%{background-position:220% 0}}
  @keyframes btnPulse{
    from{box-shadow:0 10px 28px rgba(224,80,143,.34),inset 0 1px 0 rgba(255,255,255,.28)}
    to{box-shadow:0 10px 34px rgba(160,106,224,.46),inset 0 1px 0 rgba(255,255,255,.28)}
  }
  .app.lang-en .btn-start{letter-spacing:2px}

  .start-foot{
    font-size:11.5px;color:#c0b4c4;letter-spacing:.8px;
    text-align:center;
    animation:fadeUp .7s cubic-bezier(.2,.8,.3,1) .58s backwards;
  }
  .start-foot::before{content:'♡ ';color:#ff8ec4}
  .start-foot::after{content:' ♡';color:#ff8ec4}

  /* ============ 通用按钮 ============ */
  .btn{
    display:block;width:100%;padding:15px;border:none;border-radius:16px;
    background:linear-gradient(90deg,#e0508f,#c23d78);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(224,80,143,.32);transition:.2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(224,80,143,.4)}
  .btn.ghost{
    background:#fff;color:#a080a0;border:2px solid #efe6f0;
    box-shadow:none;font-weight:500;
  }
  .btn.ghost:hover{border-color:#e8c8dc;transform:none;box-shadow:none}
  .btn.ghost:disabled{opacity:.35;cursor:not-allowed}

  /* ============ 答题页 ============ */
  .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#a08fa8;margin-bottom:10px}
  .top b{color:#c23d78;font-size:15px}
  .top #left.warn{color:#e08a3d}

  .hearts{display:flex;gap:2px;margin-bottom:24px}
  .hearts i{
    flex:1 1 0;min-width:3px;height:5px;border-radius:99px;
    background:#f2eaf2;transition:all .3s ease;
  }
  .hearts i.on{
    background:linear-gradient(90deg,#ffb3d9,#e0508f);
    box-shadow:0 0 6px rgba(224,80,143,.5);
    transform:scaleY(1.3);
  }
  .hearts i.now{
    background:linear-gradient(90deg,#a06ae0,#e0508f);
    box-shadow:0 0 10px rgba(160,106,224,.7);
    transform:scaleY(1.8);
    animation:heartBeat 1s ease-in-out infinite;
  }
  @keyframes heartBeat{0%,100%{transform:scaleY(1.8)}50%{transform:scaleY(2.4)}}

  @keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  #qcard{animation:slideIn .26s ease;position:relative}
  .meta{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .tag{font-size:11px;padding:3px 10px;border-radius:99px;background:#ffe9f4;color:#c23d78;font-weight:600;letter-spacing:.5px}
  .qnum{font-size:11px;color:#b8a8bc;letter-spacing:1px}
  #qtext{font-size:19px;line-height:1.55;font-weight:600;margin-bottom:20px;color:#2b2b33}

  #opts{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 15px;background:#fff;
    border:2px solid #f2eaf3;border-radius:15px;
    font-size:14.5px;color:#3a3540;cursor:pointer;
    text-align:left;font-family:inherit;transition:all .16s ease;
    position:relative;overflow:hidden;
  }
  .opt:hover{border-color:#f2b8d4;background:#fff9fc;transform:translateX(3px)}
  .opt:hover .key::after{opacity:1;transform:scale(1)}
  .opt .key{
    flex:0 0 24px;height:24px;line-height:24px;text-align:center;
    border-radius:8px;background:#f6eef6;color:#b07aa0;
    font-size:12px;font-weight:700;position:relative;
  }
  .opt .key::after{
    content:'♡';position:absolute;inset:0;
    color:#ff8ec4;opacity:0;transform:scale(.5);
    transition:all .2s ease;
  }
  .opt.sel{
    background:linear-gradient(90deg,#ffe9f4,#fff0f8);
    border-color:#e0508f;color:#b02a6b;font-weight:600;transform:translateX(3px);
  }
  .opt.sel .key{background:#e0508f;color:transparent}
  .opt.sel .key::after{opacity:1;transform:scale(1);color:#fff}
  .opt.dim{opacity:.4}

  .opt.shake{
    animation:shake .4s cubic-bezier(.36,.07,.19,.97);
    border-color:#ff6b9d;
    background:#fff5fa;
  }
  @keyframes shake{
    0%,100%{transform:translateX(3px)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(5px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .foot{display:flex;gap:10px;align-items:center}
  .foot .btn.ghost{width:auto;flex:0 0 110px;padding:12px;font-size:14px;border-radius:14px}
  .app.lang-en .foot .btn.ghost{flex:0 0 130px;font-size:13px}
  .hint{flex:1;text-align:right;font-size:11.5px;color:#c0b4c4;line-height:1.5}

  /* ============ 结果页 ============ */
  .score-wrap{text-align:center;margin-bottom:16px}
  .score-wrap .num{
    font-size:64px;font-weight:800;line-height:1;
    background:linear-gradient(90deg,#e0508f,#a06ae0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .score-wrap .den{font-size:16px;color:#c0b4c4;margin-left:4px}
  .score-wrap .lvl{font-size:22px;font-weight:700;margin:14px 0 8px;color:#3a3540}
  .score-wrap .desc{font-size:14px;color:#8a7f90;line-height:1.75;padding:0 6px}

  .session-stats{
    display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
    margin:0 0 20px;
    font-size:11.5px;color:#b0a4b4;
  }
  .session-stats b{color:#c23d78;font-weight:700;margin-left:3px}
  .session-stats .dot{color:#e0d4e4}

  .warn-box{
    background:linear-gradient(90deg,#fff5e6,#fff0f6);
    border:1px solid #ffd9b0;
    border-radius:14px;
    padding:12px 16px;
    font-size:12.5px;line-height:1.75;color:#a0681f;
    margin-bottom:16px;text-align:left;
  }
  .warn-box b{color:#d9641f;font-weight:700}

  .bars{margin:22px 0 20px}
  .bars h3{font-size:13px;color:#a08fa8;font-weight:600;margin-bottom:14px;letter-spacing:1px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px}
  .row .lb{flex:0 0 40px;text-align:right;color:#6b6470}
  .app.lang-en .row .lb{flex:0 0 56px;font-size:12px}
  .row .bar{flex:1;height:10px;background:#f4edf5;border-radius:99px;overflow:hidden;position:relative}
  .row .bar i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#ffc2de,#e0508f);
    transition:width .7s cubic-bezier(.3,1,.4,1);
    position:relative;
  }
  .row .bar i::after{
    content:'';position:absolute;right:0;top:50%;transform:translate(50%,-50%);
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,#ffb3d9 40%,transparent 70%);
    opacity:.9;
  }
  .row .vl{flex:0 0 42px;font-size:11.5px;color:#b0a4b4}

  .panel{
    background:#fdf9fc;border:1px solid #f4e8f2;border-radius:18px;
    padding:16px 18px;margin-bottom:14px;text-align:left;
  }
  .panel h4{font-size:12.5px;color:#c23d78;letter-spacing:1.2px;margin-bottom:10px;font-weight:700}
  .panel h4::before{content:'♡ ';color:#ff8ec4}
  .panel p{font-size:14px;line-height:1.85;color:#5c5560}
  .panel p + p{margin-top:8px}
  .panel ol{margin:0;padding-left:19px}
  .panel li{font-size:14px;line-height:1.9;color:#5c5560;margin-bottom:2px}
  .panel li b{color:#c23d78;font-weight:600}

  .dim-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed #f2e8f2;text-align:left}
  .dim-item:last-child{border-bottom:none;padding-bottom:2px}
  .dim-item .dn{flex:0 0 52px;font-weight:700;font-size:13px;color:#a06ae0;padding-top:1px}
  .app.lang-en .dim-item .dn{flex:0 0 62px;font-size:12px}
  .dim-item .dn em{display:block;font-style:normal;font-size:10px;color:#c8bcd0;font-weight:500;margin-top:2px}
  .dim-item .dt{flex:1;font-size:13.5px;line-height:1.78;color:#6b6470}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px;font-weight:600}
  .b-high{background:#ffe3f0;color:#c23d78}
  .b-mid{background:#f3ebff;color:#8a5fd0}
  .b-low{background:#eef2f6;color:#8a97a5}

  .highlight{
    background:linear-gradient(90deg,#fff2f8,#f7f0ff);
    border:1px solid #f4e0ee;border-radius:14px;
    padding:13px 16px;margin-bottom:14px;
    font-size:13.5px;line-height:1.8;color:#7a5a72;text-align:left;
  }
  .highlight b{color:#c23d78}

  .footnote{text-align:center;font-size:11.5px;color:#c0b4c4;line-height:1.7;margin:18px 0 14px}

  /* ============ 粒子 & Toast ============ */
  .particle{
    position:fixed;pointer-events:none;z-index:9999;
    font-size:16px;line-height:1;
    animation:pop 1.1s cubic-bezier(.15,.8,.4,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes pop{
    0%{transform:translate(0,0) scale(.3) rotate(0deg);opacity:1}
    70%{opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(1.2) rotate(var(--rot));opacity:0}
  }
  .confetti{
    position:fixed;top:-20px;z-index:9998;pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(105vh) rotate(720deg);opacity:0}
  }
  .toast{
    position:fixed;left:50%;top:26px;
    transform:translateX(-50%);
    padding:11px 22px;border-radius:99px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(224,80,143,.32);
    box-shadow:0 12px 30px rgba(180,120,180,.22);
    font-size:13px;color:#c23d78;font-weight:600;
    z-index:10000;pointer-events:none;
    white-space:nowrap;
    max-width:calc(100vw - 32px);
    overflow:hidden;text-overflow:ellipsis;
    opacity:0;
    animation:toastIn .36s cubic-bezier(.2,.9,.3,1) forwards;
  }
  .toast.out{animation:toastOut .32s ease forwards}
  @keyframes toastIn{
    from{opacity:0;transform:translateX(-50%) translateY(-16px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}
  }
  @keyframes toastOut{
    from{opacity:1;transform:translateX(-50%) translateY(0)}
    to{opacity:0;transform:translateX(-50%) translateY(-12px)}
  }

  @media (max-width:520px){
    body{padding:20px 12px}
    .app{padding:28px 20px 24px;border-radius:26px}
    .lang-btn{top:12px;right:12px;padding:5px 11px;font-size:11px}
    .hero-title{font-size:29px;letter-spacing:2px}

    e.style.animationDelay = (-Math.random()*26) + 's';
    document.body.appendChild(e);
  }
})();

/* ================= 语言切换 ================= */
function toggleLang(){
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  applyLang();
}

function applyLang(){
  const t = T();
  const lang = state.lang;

  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('app').classList.toggle('lang-en', lang === 'en');
  document.getElementById('langBtn').textContent = t.langBtn;

  /* --- 开始页 --- */
  document.getElementById('heroBadge').textContent = t.badge;
  document.getElementById('heroTitle').textContent = t.title;
  document.getElementById('heroSub').textContent = t.subtitle;
  document.querySelectorAll('.stat-lb').forEach((el, i) => {
    el.textContent = t.statLabels[i];
  });

  document.getElementById('features').innerHTML =
    t.features.map(f => `<li>${f}</li>`).join('');

  document.getElementById('stmtHead').textContent = t.stmtHead;
  document.getElementById('stmtInner').innerHTML =
    t.stmtBody.map(p => `<p>${p}</p>`).join('') +
    `<p class="sig">${t.stmtSig}</p>`;

  document.getElementById('btnStart').textContent = t.startBtn;
  document.getElementById('startFoot').textContent = t.startFoot;

  /* --- 答题页（如果正在进行中） --- */
  document.getElementById('prev').textContent = t.prevBtn;
  document.getElementById('hintText').innerHTML = t.hintText;
  document.getElementById('left').textContent = t.qLeft(80 - state.idx);
  if(state.onQuiz){
    document.getElementById('qProgress').innerHTML = t.qProgress(state.idx + 1);
    render();
  }

  /* --- 结果页（如果已完成） --- */
  if(state.result){
    renderResult();
  }
}

/* ================= Toast ================= */
function toast(msg, duration = 2200){
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 340);
  }, Math.max(duration - 340, 600));
}

/* ================= 工具 ================= */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function formatTime(ms){
  const s = Math.round(ms / 1000);
  const t = T();
  if(s < 60) return s + ' ' + t.secUnit;
  const m = Math.floor(s / 60);
  const r = s % 60;
  return r === 0 ? m + ' ' + t.minUnit : m + ' ' + t.minUnit + ' ' + r + ' ' + t.secUnit;
}

/* ================= 粒子 ================= */
const HEART_EMOJIS = ['♡','💖','💕','🌸','✨','💗','🎀','🩷'];
function burst(x, y, count = 10, emojis = HEART_EMOJIS){
  for(let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = x + 'px';
    p.style.top  = y + 'px';
    p.style.fontSize = (12 + Math.random()*14) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 90;
    p.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--ty', (Math.sin(ang) * dist - 30) + 'px');
    p.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}
function confetti(count = 44){
  const colors = ['#ff8ec4','#e0508f','#a06ae0','#ffb3d9','#c9a8ff','#ffd6a5'];
  const shapes = ['♡','✦','❀','★','♥'];
  for(let i = 0; i < count; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const isEmoji = Math.random() > 0.5;
    if(isEmoji){
      c.textContent = shapes[Math.floor(Math.random()*shapes.length)];
      c.style.color = colors[Math.floor(Math.random()*colors.length)];
      c.style.fontSize = (10 + Math.random()*14) + 'px';
    } else {
      c.style.width = (5 + Math.random()*6) + 'px';
      c.style.height = (8 + Math.random()*8) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
    }
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (2.4 + Math.random()*2.2) + 's';
    c.style.animationDelay = (Math.random()*0.7) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

/* ================= 开始 ================= */
function start(ev){
  if(ev){
    const r = ev.currentTarget.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, 16);
  }

  const lang = state.lang;
  const picked = shuffle([...SCENES]).slice(0, 80);

  state.quiz = picked.map(scene => {
    const lens = LENSES[Math.floor(Math.random()*LENSES.length)];
    const setArr = lens.sets[lang][Math.floor(Math.random()*lens.sets[lang].length)];
    return {
      dim: scene.dim,
      text: lens.q[lang](scene[lang]),
      options: setArr.map((txt, i) => ({ text: txt, score: SCORES[i] }))
    };
  });

  state.answers = new Array(80).fill(null);
  state.idx = 0;
  state.locked = false;
  state.onQuiz = true;
  state.screen = 'quiz';

  // 防乱答重置
  state.qStartTime = 0;
  state.testStartTime = performance.now();
  state.fastStreak = 0;
  state.fastTotal = 0;
  state.cooldownUntil = 0;

  const hearts = document.getElementById('hearts');
  hearts.innerHTML = '';
  for(let i = 0; i < 80; i++){
    const h = document.createElement('i');
    hearts.appendChild(h);
  }

  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  render();
}

/* ================= 渲染题目 ================= */
function render(){
  const q = state.quiz[state.idx];
  const t = T();

  document.getElementById('qProgress').innerHTML = t.qProgress(state.idx + 1);
  document.getElementById('left').textContent = t.qLeft(80 - state.idx);
  document.getElementById('dim').textContent = t.dimLabel[q.dim];
  document.getElementById('qnum').textContent = 'Q' + (state.idx + 1);
  document.getElementById('qtext').textContent = q.text;

  const hs = document.querySelectorAll('#hearts i');
  hs.forEach((h, i) => {
    h.classList.toggle('on', i < state.idx);
    h.classList.toggle('now', i === state.idx);
  });

  const box = document.getElementById('opts');
  box.innerHTML = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (state.answers[state.idx] === o.score ? ' sel' : '');
    b.innerHTML = `<span class="key">${i+1}</span><span>${o.text}</span>`;
    b.onclick = (e) => choose(i, e);
    box.appendChild(b);
  });
  document.getElementById('prev').disabled = (state.idx === 0);

  const card = document.getElementById('qcard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideIn .26s ease';

  state.qStartTime = performance.now();
}

/* ================= 选择 ================= */
function choose(i, ev){
  if(state.locked || !state.onQuiz) return;
  const t = T();
  const now = performance.now();

  /* 冷却拦截 */
  if(now < state.cooldownUntil){
    if(ev && ev.currentTarget){
      const el = ev.currentTarget;
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 420);
    }
    toast(t.cooldownToasts[Math.floor(Math.random()*t.cooldownToasts.length)], 1500);
    return;
  }

  state.locked = true;
  const elapsed = now - state.qStartTime;

  /* 速度判定 */
  if(elapsed < FAST_MS){
    state.fastStreak++;
    state.fastTotal++;
    if(state.fastStreak >= STREAK_TRIGGER){
      state.cooldownUntil = performance.now() + COOLDOWN_MS;
      state.fastStreak = 0;
      toast(t.streakToasts[Math.floor(Math.random()*t.streakToasts.length)], 2200);
      const leftEl = document.getElementById('left');
      leftEl.classList.add('warn');
      setTimeout(() => leftEl.classList.remove('warn'), 1400);
    }
  } else {
    state.fastStreak = 0;
  }

  if(ev && ev.currentTarget){
    const r = ev.currentTarget.getBoundingClientRect();
    burst(r.left + r.width * 0.5, r.top + r.height * 0.5, 6);
  }

  state.answers[state.idx] = state.quiz[state.idx].options[i].score;
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.classList.toggle('sel', j === i);
    if(j !== i) b.classList.add('dim');
  });

  setTimeout(() => {
    state.locked = false;
    if(state.idx === state.quiz.length - 1) finish();
    else { state.idx++; render(); }
  }, 190);
}

function prevQ(){
  if(state.locked || state.idx === 0) return;
  state.idx--;
  render();
}

document.addEventListener('keydown', e => {
  if(!state.onQuiz) return;
  if(e.key >= '1' && e.key <= '5'){
    const i = Number(e.key) - 1;
    const opts = document.querySelectorAll('.opt');
    if(opts[i]) choose(i, { currentTarget: opts[i] });
  }
  else if(e.key === 'ArrowLeft' || e.key === 'Backspace'){ e.preventDefault(); prevQ(); }
});

/* ================= 结算 ================= */
function finish(){
  state.onQuiz = false;
  state.screen = 'result';

  const totalElapsed = performance.now() - state.testStartTime;
  const total = state.answers.reduce((a,b) => a + (b||0), 0);
  const index = Math.round(total / 480 * 500);
  const avgTime = totalElapsed / 80;
  const invalid = (state.fastTotal >= INVALID_FAST) || (avgTime < INVALID_AVG);

  // 六维统计
  const dims = {};
  state.quiz.forEach((q, i) => {
    if(!dims[q.dim]) dims[q.dim] = { got:0, max:0 };
    dims[q.dim].got += (state.answers[i] || 0);
    dims[q.dim].max += 6;
  });
  const list = Object.keys(dims).map(k => ({
    key: k,
    pct: Math.round(dims[k].got / dims[k].max * 100)
  })).sort((a,b) => b.pct - a.pct);

  state.result = {
    index, totalElapsed, avgTime, invalid, list,
    fastTotal: state.fastTotal
  };

  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  window.scrollTo({ top:0, behavior:'smooth' });

  setTimeout(() => confetti(invalid ? 18 : 50), 120);

  renderResult(true);
}

/* ================= 渲染结果 ================= */
function renderResult(animateScore){
  const t = T();
  const r = state.result;
  if(!r) return;

  /* 分数滚动 */
  const scoreEl = document.getElementById('score');
  if(animateScore){
    let shown = 0;
    const target = r.index;
    const step = Math.max(1, Math.round(target / 40));
    const tick = setInterval(() => {
      shown += step;
      if(shown >= target){ shown = target; clearInterval(tick); }
      scoreEl.textContent = shown;
    }, 26);
  } else {
    scoreEl.textContent = r.index;
  }

  document.getElementById('scoreDen').textContent = t.scoreDen;

  const L = t.levels.find(x => r.index <= x.max) || t.levels[t.levels.length-1];
  document.getElementById('lvl').textContent = L.lvl;
  document.getElementById('desc').textContent = L.desc;

  /* 统计条 */
  const avgSec = (r.avgTime / 1000).toFixed(1);
  document.getElementById('sessionStats').innerHTML =
    `${t.statTime}<b>${formatTime(r.totalElapsed)}</b>` +
    `<span class="dot">·</span>` +
    `${t.statAvg}<b>${avgSec} ${t.secUnit}</b>` +
    `<span class="dot">·</span>` +
    `${t.statFast}<b>${r.fastTotal} ${t.statUnit}</b>`;

  /* 警告条 */
  const warnBox = document.getElementById('warnBox');
  if(r.invalid){
    warnBox.classList.remove('hidden');
    warnBox.innerHTML = t.warnInvalid(r.fastTotal, avgSec);
  } else if(r.fastTotal >= 6){
    warnBox.classList.remove('hidden');
    warnBox.innerHTML = t.warnMild(r.fastTotal);
  } else {
    warnBox.classList.add('hidden');
  }

  /* 六维条 */
  document.getElementById('barsTitle').textContent = t.barsTitle;
  document.getElementById('barList').innerHTML = r.list.map(d => `
    <div class="row">
      <span class="lb">${t.dimLabel[d.key]}</span>
      <span class="bar"><i data-w="${d.pct}%"></i></span>
      <span class="vl">${d.pct}%</span>
    </div>
  `).join('');
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar i').forEach(el => { el.style.width = el.dataset.w; });
  });

  /* 高亮 */
  const top = r.list[0], bottom = r.list[r.list.length-1];
  document.getElementById('hl').innerHTML =
    `${t.hlTop} <b>${t.dimLabel[top.key]}（${top.pct}%）</b>，${t.hlBottom} <b>${t.dimLabel[bottom.key]}（${bottom.pct}%）</b>。` +
    (top.pct - bottom.pct >= 40 ? t.hlStrong : t.hlEven);

  /* 维度解读 */
  document.getElementById('panelDim').textContent = t.panelDim;
  document.getElementById('dimDetail').innerHTML = r.list.map(d => {
    const meta = t.dimMeta[d.key];
    let lv, cls;
    if(d.pct >= 60){ lv = t.lvHigh; cls = 'b-high'; }
    else if(d.pct >= 30){ lv = t.lvMid; cls = 'b-mid'; }
    else { lv = t.lvLow; cls = 'b-low'; }
    const txt = d.pct >= 60 ? meta.high : (d.pct >= 30 ? meta.mid : meta.low);
    return `<div class="dim-item">
      <div class="dn">${t.dimLabel[d.key]}<em>${meta.icon}</em></div>
      <div class="dt"><span class="badge ${cls}">${lv} · ${d.pct}%</span>${txt}</div>
    </div>`;
  }).join('');

  /* 三面板 */
  document.getElementById('panelAnalysis').textContent = t.panelAnalysis;
  document.getElementById('panelTip').textContent = t.panelTip;
  document.getElementById('panelNext').textContent = t.panelNext;
  document.getElementById('pAnalysis').textContent = L.analysis;
  document.getElementById('pTip').textContent = L.tip;
  document.getElementById('pNext').innerHTML = L.next.map(x => `<li>${x}</li>`).join('');

  document.getElementById('footnote').innerHTML = t.footnote;
  document.getElementById('againBtn').textContent = t.againBtn;
}

/* ================= 折叠声明 ================= */
function toggleStmt(){
  document.getElementById('statement').classList.toggle('open');
}

/* ================= 初始化 ================= */
applyLang();
</script>
